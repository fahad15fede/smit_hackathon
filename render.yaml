# Render Blueprint for the FastAPI backend.
# Render dashboard -> New -> Blueprint -> select this repository. Values marked `sync: false`
# are secrets: Render asks for them once when the Blueprint is created.
services:
  - type: web
    name: hcm-lite-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Origins allowed by CORS: the Vercel site, plus the local dev server. Comma-separated, no trailing slash.
      - key: FRONTEND_ORIGIN
        value: https://smit-hackathon-coral.vercel.app,http://localhost:5173
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
